name: Import tea
on:
  push:
    branches: [main]
    paths: [bootstrap/**]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Import pinned source and apply reviewed changes
        run: |
          cp bootstrap/overlay.b64 "$RUNNER_TEMP/tea-overlay.b64"
          cp bootstrap/apply.py "$RUNNER_TEMP/apply-tea.py"
          cp .github/workflows/import.yml "$RUNNER_TEMP/tea-import.yml"
          cp .github/workflows/ci.yml "$RUNNER_TEMP/tea-ci.yml"
          git fetch --no-tags --depth=1 https://github.com/morluto/rea.git f89b03e738fe94f2bea6927c84e05871293707ea
          test "$(git rev-parse FETCH_HEAD)" = "f89b03e738fe94f2bea6927c84e05871293707ea"
          git read-tree --reset -u FETCH_HEAD
          python "$RUNNER_TEMP/apply-tea.py"
          cp "$RUNNER_TEMP/tea-import.yml" .github/workflows/import.yml
          cp "$RUNNER_TEMP/tea-ci.yml" .github/workflows/ci.yml
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:cached
      - run: npm run typecheck
      - run: node scripts/verify-tea.mjs
      - run: npx --no-install vitest run src/domain/skillManifest.test.ts tests/conformance/contracts/mcpToolFamilies.test.ts tests/boundary/mcp/serverLifecycleMcp.test.ts
      - name: Save imported repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore!: import tea with minimal public branding" -m "Source snapshot: morluto/rea@f89b03e738fe94f2bea6927c84e05871293707ea. Preserve analysis implementations and internal configuration names."
          git push origin HEAD:main
